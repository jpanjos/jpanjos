name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar-links:
    name: Verificar links do Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Checar links com lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # linkedin.com responde 999 para robôs e não é um link quebrado.
          args: --no-progress --max-retries 2 --exclude 'linkedin\.com' './*.md'
          fail: true
